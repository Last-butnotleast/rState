[package]
name = "rstate-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Private browser conformance bridge for the rstate core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rstate = { path = "../rstate", features = ["json"] }
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
